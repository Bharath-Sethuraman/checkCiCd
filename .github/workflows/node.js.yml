name: Auto Merge to Main

on:
  push:
    branches_ignore:
      - main

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request (using gh CLI)
        id: create_pr
        run: |
          gh pr create --base main --head ${{ github.ref }} --title "Automated Merge: ${{ github.ref }} to main" --body "Automated pull request created by GitHub Actions."
          pr_number=$(gh pr list --head ${{ github.ref }} --base main --json number -q '.[0].number')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT # Set output for next step

      - name: Enable Auto Merge (if PR created)
        if: steps.create_pr.outputs.pr_number
        run: |
          gh pr merge $pr_number --merge-method squash # or merge or rebase